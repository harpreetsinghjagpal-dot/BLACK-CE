<style>
/*
VOICE: calm road-safety tool for drivers, urgent only where the data says so
IDEA: highway message sign at night; provinces as folders you open
PICTURE: self-drawn map (Canada overview, then each province with highways, towns, cameras)
COLOUR/TYPE: asphalt #12161b, ice blue #9fd8ff, risk red/amber/yellow/green; Noto Sans Gurmukhi + Manrope
LAYOUT: header, map, folders/highways, cameras, notes; stacks on phones
*/
:root{--bg:#12161b;--card:#1b2129;--line:#2b333e;--ink:#eef2f6;--mute:#9aa6b4;--ice:#9fd8ff;--r4:#ff4d4d;--r3:#ff9a2e;--r2:#ffd84a;--r1:#4fd18b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Gurmukhi","Manrope",system-ui,sans-serif;overflow-x:clip}
header{padding:18px max(4vw,14px) 8px}
.tag{color:var(--ice);font-weight:700;font-size:15px;margin-top:2px}
.hrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.langw select{font:inherit;font-size:16px;min-height:44px;border-radius:12px;border:1px solid var(--ice);background:#0c1014;color:var(--ice);padding:0 10px;max-width:60vw}
.langw select:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[dir=rtl] .why,[dir=rtl] #tip ul{padding-left:0;padding-right:18px}[dir=rtl] .fold{border-left:1px solid var(--line);border-right:6px solid var(--c)}[dir=rtl] .rep{border-left:0;border-right:4px solid}
h1{margin:0;font-size:clamp(24px,5vw,36px);line-height:1.1;font-weight:800}
h1 span{color:var(--ice)}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.band{padding:14px max(4vw,14px)}
h2{font-size:20px;margin:6px 0 10px;line-height:1.25}
.gpsrow{display:flex;flex-wrap:wrap;gap:8px;padding:0 max(4vw,14px) 10px}.gpsrow .back{margin:0}
.gpsb{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border-radius:12px;border:0;background:#2f7cf6;color:#fff;cursor:pointer}.gpsb.on{background:#0c1014;color:#7fb2ff;border:1px solid #2f7cf6}.gpsb:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
#gpsbar{margin:0 max(4vw,14px) 10px;background:#0f1d33;border:1px solid #2f7cf6;border-radius:14px;padding:12px 14px;font-size:15px}#gpsbar b.big{font-size:18px}#gpsbar select{font:inherit;font-size:16px;min-height:44px;width:100%;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:#0c1014;color:var(--ink);padding:0 10px}
.back{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ice);background:transparent;color:var(--ice);cursor:pointer;margin:0 max(4vw,14px) 10px}
.back:focus-visible,a:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
#map{margin:0 max(4vw,14px);border-radius:16px;border:1px solid var(--line);background:#0c1014;padding:10px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
#svg{width:100%;height:auto;max-height:70vh;display:block}
#svg text{font:600 11px Manrope,sans-serif;fill:#cfd7e0;paint-order:stroke;stroke:#0c1014;stroke-width:3px;pointer-events:none}
#svg .hn{font:800 9px Manrope,sans-serif;fill:#111;stroke:none}
#svg .tw,#svg .cm,#svg .pv{cursor:pointer}
#svg .pv:hover path{filter:brightness(1.25)}
#tip{font-size:15px;color:#cfd7e0;padding:6px 4px;align-self:center}#tip b{font-size:18px}
#tip ul,.why{padding-left:18px;margin:6px 0 0;font-size:14px;color:#cfd7e0}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{background:var(--card);border-radius:12px;padding:10px;border-top:4px solid var(--c)}
.chip b{display:block;font:800 26px/1.1 Manrope,sans-serif}.chip small{color:var(--mute);font-size:13px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fold{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;color:var(--ink);text-decoration:none;min-height:64px}
.fold .nm{flex:1;font-weight:600;line-height:1.3}.fold small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.badge{flex:none;font:800 15px Manrope,sans-serif;min-width:48px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--c);color:#111}
.hw{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.hw summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;min-height:56px}
.hw summary::-webkit-details-marker{display:none}
.hw .nm{flex:1;font-weight:600}.hw .nm small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.lv{flex:none;font-size:14px;color:var(--c);font-weight:600}
.town{padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.town .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.town .t{font-weight:600}
.m{color:var(--mute);font-size:13px;white-space:nowrap}
.cams{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cam{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:10px;background:#0f2a3d;color:var(--ice);text-decoration:none;font-size:14px;font-weight:600;border:1px solid #24506e}
.rep{background:var(--card);border-left:4px solid var(--r4);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}.rep small{color:var(--mute)}
#cq{width:100%;font:inherit;font-size:16px;min-height:46px;margin:8px 0 10px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#cq:focus-visible{outline:3px solid var(--ice)}
.cr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;text-decoration:none;color:var(--ink);font-size:15px;min-height:48px}
.cr span:last-child{color:var(--ice);white-space:nowrap;font-weight:600}
.note{color:var(--mute);font-size:14px}.note a{color:var(--ice)}
#pub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:4px}
.cnts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.cnt{display:flex;align-items:center;gap:6px;background:#0c1014;border-radius:10px;padding:6px 10px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.vbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.vb{font:inherit;font-weight:700;min-height:52px;border-radius:12px;border:2px solid var(--c);background:transparent;color:var(--ink);cursor:pointer;padding:6px;line-height:1.2}
.vb.on{background:var(--c);color:#111}.vb:disabled{opacity:.5}
.vb:focus-visible,.pubb:focus-visible,#csend:focus-visible,#tsel:focus-visible,#ctxt:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
#tsel,#ctxt{width:100%;font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--line);background:#0c1014;color:var(--ink);padding:10px 12px}
#tsel{min-height:46px}#ctxt{min-height:80px;resize:vertical;margin-top:6px}
#csend{font:inherit;font-weight:700;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--ice);color:#111;cursor:pointer;margin-top:8px}
#csend:disabled{opacity:.5}
.cm1{border-top:1px solid var(--line);padding:10px 0;font-size:15px}.cm1 .who{font-weight:700}.cm1 .tx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.del{font:inherit;font-size:13px;background:none;border:0;color:var(--r3);cursor:pointer;padding:4px;min-height:32px}
.pubb{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px;margin-top:6px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:#0c1014;color:var(--ink);cursor:pointer}
.pubb .dot{width:9px;height:9px}
.pmsg{font-size:14px;color:var(--r2);margin:6px 0}
.fcl{display:block;margin-top:3px}.fcb{display:inline-block;min-width:30px;text-align:center;font:800 12px Manrope,sans-serif;padding:1px 6px;border-radius:7px;background:var(--c);color:#111}
.fct{margin-top:6px;font-size:14px}.rb{border-top:2px dashed var(--line);padding:12px 14px;background:#151a21}.rb h3{font-size:16px;margin:0 0 6px}
.ctxt{width:100%;font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--line);background:#0c1014;color:var(--ink);padding:10px 12px;min-height:70px;resize:vertical;margin-top:6px}
.csend{font:inherit;font-weight:700;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--ice);color:#111;cursor:pointer;margin-top:8px}.csend:disabled{opacity:.5}
.ctxt:focus-visible,.csend:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
@media(max-width:600px){#map{grid-template-columns:1fr}#svg{max-height:none}#tip{min-height:64px}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

const LOC={"zh-Hant":"zh-HK",tl:"fil",pa:"pa-IN"};
let LANG=(()=>{try{const s=localStorage.getItem("bi_lang");if(s&&I18N[s])return s}catch(e){}
  for(const l of (navigator.languages||[navigator.language||"en"])){const x=String(l).toLowerCase();
    if(/^zh-(hant|tw|hk|mo)/.test(x)||x==="yue"||x.startsWith("yue"))return "zh-Hant";if(x.startsWith("zh"))return "zh";if(x.startsWith("fil"))return "tl";
    const b=x.split("-")[0];if(I18N[b])return b}return "en"})();
function tx(k,...a){const L=I18N[LANG]||I18N.en;let s=(L.s[k]??I18N.en.s[k]??k);return s.replace(/\{(\d)\}/g,(m,i)=>a[+i]??"")}

const LV=[{min:60,k:"r4",i:"lv4"},{min:35,k:"r3",i:"lv3"},{min:15,k:"r2",i:"lv2"},{min:-1,k:"r1",i:"lv1"}];LV.forEach(l=>Object.defineProperty(l,"t",{get:()=>tx(l.i)}));

const km=(a,b,c,d)=>{const r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.hypot(x,y)*6371};

// ---------- Risk model ----------
const FRZ=[56,57,66,67],RAIN=[51,53,55,61,63,65,80,81,82],SNOW=[71,73,75,77,85,86],FOG=[45,48];
function score(w){const why=[];let s=0;const T=w.air;
  if(T<=1&&T>=-6){s+=25;why.push(tx("rTemp",fmt(T)))}
  else if(T>1&&T<=3){s+=12;why.push(tx("rTempNight",fmt(T)))}
  else if(T<-6&&T>=-14){s+=15;why.push(tx("rTempFrozen",fmt(T)))}
  else if(T<-14)s+=6;
  if(FRZ.includes(w.code)){s+=45;why.push(tx("rFrzRain"))}
  else if(RAIN.includes(w.code)&&T<=2){s+=30;why.push(tx("rColdRain"))}
  if(w.pp>=0.2&&T<=2){s+=22;why.push(tx("rPrecip",fmt(w.pp)))}
  if(w.pm>=1&&T<=0){s+=20;why.push(tx("rRefreeze",fmt(w.pm)))}
  if(FOG.includes(w.code)&&T<=1){s+=15;why.push(tx("rFog"))}
  if(w.dew!=null&&w.air-w.dew<=2&&T<=1){s+=12;why.push(tx("rFrost"))}
  if(T>0&&w.fm!=null&&w.fm<=0&&(w.pp>=0.2||RAIN.includes(w.code))){s+=15;why.push(tx("rWillFreeze",fmt(w.fm)))}
  if(!w.day&&w.cloud<30&&w.wind<10&&T<=2){s+=8;why.push(tx("rClear"))}
  if(SNOW.includes(w.code)){s+=8;why.push(tx("rSnow"))}
  if(T>4&&!FRZ.includes(w.code))s=Math.min(s,10);
  return {s:Math.max(0,Math.min(100,s)),why,T};
}

let D=null;
function prep(){
  for(const c of D.order){const p=D.p[c];
    p.T=p.towns.map(t=>{const w={air:t[3],dew:t[4],code:t[5],cloud:t[6],wind:t[7],day:!!t[8],pm:t[9],pp:t[10],fm:t[11]};const r=score(w);const f=t[12];let fc=null;if(f){const fw={air:f[1],dew:f[2],code:f[3],cloud:f[4],wind:f[5],day:!!f[6],pm:f[7],pp:f[8],fm:f[9]};fc={at:f[0],w:fw,r:score(fw)}}return {n:t[0],la:t[1],lo:t[2],w,r,base:r.s,fc}});
    const idx=Object.fromEntries(p.T.map((t,i)=>[t.n,i]));
    p.H=p.hw.map(([no,name,ts])=>({no,name,towns:ts.map(n=>idx[n])}));
    p.T.forEach((t,i)=>{
      t.cams=p.cams.map(k=>({k,d:km(t.la,t.lo,k[2],k[3])})).filter(o=>o.d<40).sort((a,b)=>a.d-b.d).slice(0,3).map(o=>o.k);
      const my=p.H.filter(h=>h.towns.includes(i)).map(h=>h.no);

function fitProj(pts,W){let a=90,b=-90,c=180,d=-180;for(const[la,lo]of pts){a=Math.min(a,la);b=Math.max(b,la);c=Math.min(c,lo);d=Math.max(d,lo)}
  const k=Math.cos((a+b)/2*Math.PI/180),sx=(d-c)*k,sy=b-a,s=(W-16)/Math.max(sx,sy*0.62);
  const H=Math.min(sy*s+16,W*1.6),s2=Math.min(s,(H-16)/sy);return {P:(la,lo)=>[8+(lo-c)*k*s2,8+(b-la)*s2],H:Math.ceil(sy*s2+16)}}
function overProj(){const r0=Math.PI/180;const raw=(la,lo)=>{const r=90-la,t=(lo+96)*0.62*r0;return [r*Math.sin(t),r*Math.cos(t)]};
  let mx=1e9,Mx=-1e9,my=1e9,My=-1e9;for(const c in D.over)for(const rg of D.over[c])for(const q of rg){const[x,y]=raw(q[1],q[0]);mx=Math.min(mx,x);Mx=Math.max(Mx,x);my=Math.min(my,y);My=Math.max(My,y)}
  const W=300,s=(W-12)/(Mx-mx);return {P:(la,lo)=>{const[x,y]=raw(la,lo);return [6+(x-mx)*s,6+(y-my)*s]},H:Math.ceil((My-my)*s+12)}}

async function comment(k,mine,ta){const t=(ta?ta.value:"").trim().slice(0,300);if(!t||busyW||!ME)return;busyW=true;pubMsg="";
  const items=[{k,txt:t,v:mine||"",at:Date.now()},...MYC].slice(0,40);
  try{await DB.doc("comments/"+ME).set({items});MYC=items;busyW=false;if(ta)ta.value="";renderPub()}catch(e){wfail(e,k)}}
async function delCom(by,at,k){if(busyW)return;busyW=true;
  try{const ref=DB.doc("comments/"+by);const sn=await ref.get();const items=((sn.exists&&sn.data().items)||[]).filter(c=>c.at!==at);await ref.set({items});if(by===ME)MYC=items;busyW=false;renderPub()}catch(e){wfail(e,k)}}
(async()=>{
  try{DB=await claude.use("db");USR=await claude.use("user")}catch(e){DB=null}
  if(!DB){pubState="off";renderPub();return}
  try{ME=USR?await USR.id():null;OWNER=USR?!!(await USR.isOwner()):false}catch(e){}
  let gotR=false,gotC=false;const tm=setTimeout(()=>{if(!gotR||!gotC){pubState="slow";renderPub()}},10000);
  const done=()=>{if(gotR&&gotC){clearTimeout(tm);pubState="ready";renderPub()}};
  DB.collection("reports").onSnapshot(sn=>{const td=today(),agg={};
    for(const d of sn.docs){const v=(d.data()||{}).v||{};if(d.id===ME)MYV={...v};for(const [k,o] of Object.entries(v)){if(!o||o.d!==td||!VC[o.v])continue;(agg[k]=agg[k]||{})[o.v]=(agg[k][o.v]||0)+1}}
    VOTES=agg;if(!sn.metadata.fromCache)gotR=true;done();renderPub()},e=>{gotR=true;pubMsg=tx("repFail");done()});
  DB.collection("comments").onSnapshot(sn=>{const all=[];
    for(const d of sn.docs){const it=(d.data()||{}).items||[];if(d.id===ME)MYC=it.slice();for(const c of it)if(c&&typeof c.txt==="string")all.push({k:String(c.k),txt:c.txt.slice(0,300),v:VC[c.v]?c.v:"",at:+c.at||0,by:d.id})}
    COMS=all.sort((a,b)=>b.at-a.at);if(!sn.metadata.fromCache)gotC=true;done();renderPub()},e=>{gotC=true;pubMsg=tx("comFail");done()});
})();
// ---------- Live GPS ----------
let GPS=null,WATCH=null,lastDraw=0,manual=false,gpsErr="",gpsWarn="";
function segDist(la,lo,A,B){const k=Math.cos(la*Math.PI/180)*111.32,ax=(A.lo-lo)*k,ay=(A.la-la)*110.57,bx=(B.lo-lo)*k,by=(B.la-la)*110.57;
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?-(ax*dx+ay*dy)/L:0;t=Math.max(0,Math.min(1,t));return {d:Math.hypot(ax+t*dx,ay+t*dy),t}}
const bearing=(a,b,c,d)=>{const r=Math.PI/180,y=Math.sin((d-b)*r)*Math.cos(c*r),x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)/r+360)%360};
function locate(la,lo,hd,acc){let best=null;
  for(const c of D.order){const p=D.p[c];p.H.forEach((h,hi)=>{for(let j=0;j<h.towns.length-1;j++){const A=p.T[h.towns[j]],B=p.T[h.towns[j+1]],r=segDist(la,lo,A,B);if(!best||r.d<best.d)best={prov:c,hi,j,d:r.d,t:r.t,A,B}}})}
  const p=D.p[best.prov];let near=null,nd=1e9;for(const t of p.T){const d=km(la,lo,t.la,t.lo);if(d<nd){nd=d;near=t}}
  let ahead=null;if(hd!=null){const dA=Math.abs(((bearing(la,lo,best.A.la,best.A.lo)-hd+540)%360)-180),dB=Math.abs(((bearing(la,lo,best.B.la,best.B.lo)-hd+540)%360)-180);ahead=dA<dB?best.A:best.B}
  return {...best,la,lo,hd,acc,near,nd,ahead}}
function gpsBar(){const bar=$("gpsbar");if(!GPS&&!WATCH&&!manual){bar.hidden=true;return}bar.hidden=false;
  const selHtml=`<label class="note" for="msel" style="display:block;margin-top:8px">${esc(tx("orPick"))}</label><select id="msel"><option value="">${esc(tx("choose"))}</option>${D.order.map(c=>`<optgroup label="${esc(pn(D.p[c]))}">${D.p[c].T.map(x=>`<option value="${c}|${esc(x.n)}">${esc(x.n)}</option>`).join("")}</optgroup>`).join("")}</select>`;
  const bindSel=()=>{const ms=$("msel");if(ms)ms.onchange=e=>{const[c,n]=e.target.value.split("|");const x=D.p[c]&&D.p[c].T.find(q=>q.n===n);if(x){manual=true;onFix(x.la,x.lo,null,0,true)}}};
  if(!GPS){bar.innerHTML=WATCH!=null?`<span class="note">${esc(tx("gpsSearching"))}</span>`:(gpsErr?`<p class="pmsg" style="margin-top:0">${esc(gpsErr)}</p>`:"")+selHtml;bindSel();return}
  const p=D.p[GPS.prov],h=p.H[GPS.hi],t=GPS.ahead||GPS.near,l=level(t.r.s);
  const on=GPS.d<60,cam=p.cams.map(k=>({k,d:km(GPS.la,GPS.lo,k[2],k[3])})).sort((a,b)=>a.d-b.d)[0];
  bar.innerHTML=`${manual?'<span class="m">'+esc(tx("manualPlace"))+'</span><br>':""}${on?`<b class="big">${esc(tx("onHw",h.no))}</b> — ${esc(h.name)}<br>`:`<b class="big">${esc(tx("inProv",pn(p)))}</b><br><span class="m">${esc(tx("noHwNear",Math.round(GPS.d)))}</span><br>`}
   ${esc(tx("fromKm",Math.round(GPS.nd),GPS.near.n))}${GPS.ahead&&GPS.ahead!==GPS.near?` · ${esc(tx("ahead",GPS.ahead.n))}`:""}<br>
   <span style="color:var(--${l.k});font-weight:700">${esc(tx("riskTo",t.n,l.t,t.r.s))}</span>${t.r.why[0]?`<br><span class="m" style="white-space:normal">${esc(t.r.why[0])}</span>`:""}${t.fc?`<br>${fcBadge(t.fc.r.s)} ${esc(tx("fcTown",level(t.fc.r.s).t,t.fc.r.s,fmtHour(t.fc.at)))}`:""}
   ${cam&&cam.d<60?`<div class="cams"><a class="cam" href="${esc(camUrl(p,cam.k))}" target="_blank" rel="noopener">${esc(tx("nearCam",Math.round(cam.d)))}</a></div>`:""}
   ${WATCH!=null?(gpsWarn?`<div class="m" style="white-space:normal">${esc(gpsWarn)}</div>`:""):selHtml}`;
  if(gpsErr&&WATCH==null)bar.insertAdjacentHTML("afterbegin",`<p class="pmsg" style="margin-top:0">${esc(gpsErr)}</p>`);
  bindSel();
}
function onFix(la,lo,hd,acc,force){if(!D)return;const prev=GPS;GPS=locate(la,lo,hd,acc);
  const moved=!prev||km(prev.la,prev.lo,la,lo)>0.1||prev.prov!==GPS.prov;
  if(!prev||prev.prov!==GPS.prov||force){selTown=GPS.near.n;if(cur!==GPS.prov){location.hash=GPS.prov.toLowerCase();return gpsBar()}}
  if(moved&&(Date.now()-lastDraw>3000||force)){lastDraw=Date.now();if(cur)drawProv(cur);else drawHome();
    if(cur===GPS.prov&&(!prev||prev.near!==GPS.near||force)){selTown=GPS.near.n;townTip(D.p[cur],GPS.near);renderPub()}}
  gpsBar()}
function gpsFail(msg){if(WATCH!=null){try{navigator.geolocation.clearWatch(WATCH)}catch(e){}}WATCH=null;$("gpsb").classList.remove("on");$("gpsb").textContent=tx("gpsOn");manual=true;gpsErr=msg;gpsBar()}
function startGps(){if(WATCH!=null)return;
  if(!navigator.geolocation)return gpsFail(tx("noGeo"));
  manual=false;gpsErr="";gpsWarn="";$("gpsb").classList.add("on");$("gpsb").textContent=tx("gpsOff");
  try{WATCH=navigator.geolocation.watchPosition(ps=>{const c=ps.coords;manual=false;gpsErr="";gpsWarn="";onFix(c.latitude,c.longitude,(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)?c.heading:null,c.accuracy)},
    er=>{if(er&&er.code===1)return gpsFail(STANDALONE?tx("geoDenied"):tx("geoInClaude"));
      gpsWarn=GPS?tx("gpsWeak"):tx("gpsSeek");gpsBar()},
    {enableHighAccuracy:true,maximumAge:10000,timeout:30000})}catch(e){gpsFail(tx("geoFail"))}
  gpsBar()}
$("gpsb").addEventListener("click",()=>{
  if(WATCH!=null||manual){if(WATCH!=null)navigator.geolocation.clearWatch(WATCH);WATCH=null;GPS=null;manual=false;gpsErr="";$("gpsb").classList.remove("on");$("gpsb").textContent=tx("gpsOn");gpsBar();if(cur)drawProv(cur);else drawHome();return}
  startGps()});
const STANDALONE=typeof __SA!=="undefined";
function loadData(){return STANDALONE?Promise.resolve(JSON.parse(JSON.stringify(__SA))):fetch("data.json").then(r=>r.json())}
function fcPeak(h,nowISO){const FRZ=[56,57,66,67],RAIN=[51,53,55,61,63,65,80,81,82],SNOW=[71,73,75,77,85,86],FOG=[45,48];
 const sc=w=>{let s=0;const T=w.air;if(T<=1&&T>=-6)s+=25;else if(T>1&&T<=3)s+=12;else if(T<-6&&T>=-14)s+=15;else if(T<-14)s+=6;
  if(FRZ.includes(w.code))s+=45;else if(RAIN.includes(w.code)&&T<=2)s+=30;if(w.pp>=0.2&&T<=2)s+=22;if(w.pm>=1&&T<=0)s+=20;
  if(FOG.includes(w.code)&&T<=1)s+=15;if(w.dew!=null&&w.air-w.dew<=2&&T<=1)s+=12;
  if(T>0&&w.fm!=null&&w.fm<=0&&(w.pp>=0.2||RAIN.includes(w.code)))s+=15;if(!w.day&&w.cloud<30&&w.wind<10&&T<=2)s+=8;if(SNOW.includes(w.code))s+=8;
  if(T>4&&!FRZ.includes(w.code))s=Math.min(s,10);return Math.max(0,Math.min(100,s))};
 const t=h.time,n=t.length;let i0=t.findIndex(x=>x>nowISO.slice(0,13)+":00");if(i0<0)i0=0;let best=null;
 for(let i=i0;i<Math.min(n,i0+24);i++){let pm=-99,pp=0,fm=99;for(let j=Math.max(0,i-9);j<i;j++)pm=Math.max(pm,h.temperature_2m[j]);
  for(let j=Math.max(0,i-6);j<=i;j++)pp+=h.precipitation[j]||0;for(let j=i+1;j<=Math.min(n-1,i+6);j++)fm=Math.min(fm,h.temperature_2m[j]);
  const w={air:h.temperature_2m[i],dew:h.dew_point_2m[i],code:h.weather_code[i],cloud:h.cloud_cover[i],wind:h.wind_speed_10m[i],day:!!h.is_day[i],pm,pp:+pp.toFixed(1),fm:fm===99?null:fm};
  const s=sc(w);if(!best||s>best.s)best={s,i,w}}
 if(!best)return null;const w=best.w;return [t[best.i],w.air,w.dew,w.code,w.cloud,Math.round(w.wind),w.day?1:0,w.pm,w.pp,w.fm,best.s]}

async function liveWx(){if(!STANDALONE)return;try{
  const all=D.order.flatMap(c=>D.p[c].towns);
  const u="https://api.open-meteo.com/v1/forecast?latitude="+all.map(t=>t[1]).join(",")+"&longitude="+all.map(t=>t[2]).join(",")+"&current=temperature_2m,dew_point_2m,weather_code,cloud_cover,wind_speed_10m,is_day&hourly=temperature_2m,precipitation,dew_point_2m,weather_code,cloud_cover,wind_speed_10m,is_day&past_hours=9&forecast_hours=31&timezone=auto";
  const j=await fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});const arr=Array.isArray(j)?j:[j];if(arr.length!==all.length)return;
  arr.forEach((d,i)=>{const c=d.current,h=d.hourly;let pm=-99,pp=0,fm=99;const lim=new Date(new Date(c.time).getTime()+6*36e5).toISOString().slice(0,16);h.time.forEach((tm,k)=>{if(tm<=c.time){pm=Math.max(pm,h.temperature_2m[k]);pp+=h.precipitation[k]||0}else if(tm<=lim)fm=Math.min(fm,h.temperature_2m[k])});
    all[i].splice(3,10,c.temperature_2m,c.dew_point_2m,c.weather_code,c.cloud_cover,Math.round(c.wind_speed_10m),c.is_day,pm,+pp.toFixed(1),fm===99?null:fm,fcPeak(h,c.time))});
  prep();WX_LIVE=Date.now();updLabel();
  const keep=GPS;if(cur)prov(cur);else home();if(keep){GPS=null;onFix(keep.la,keep.lo,keep.hd,keep.acc,true)}}catch(e){}}
function afterLoad(){
  if(STANDALONE){startGps();liveWx();setInterval(liveWx,15*60*1000);return}
  try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted")startGps()}).catch(()=>{})}catch(e){}}
function setLang(c){if(!I18N[c])return;LANG=c;try{localStorage.setItem("bi_lang",c)}catch(e){}applyStatic();
  if(D){const g=GPS;prep();updLabel();GPS=null;if(cur)prov(cur);else home();if(g)onFix(g.la,g.lo,g.hd,g.acc,true);else gpsBar()}}
$("lang").innerHTML=Object.entries(I18N).map(([c,v])=>`<option value="${c}">${esc(v.n)}</option>`).join("");$("lang").value=LANG;
$("lang").addEventListener("change",e=>setLang(e.target.value));
applyStatic();
function route(){const h=location.hash.slice(1).toUpperCase();if(D&&D.p[h])prov(h);else if(D)home()}
$("svg").addEventListener("click",e=>{
  const pv=e.target.closest(".pv");if(pv&&D.p[pv.dataset.p]){location.hash=pv.dataset.p.toLowerCase();return}
  if(!cur)return;const p=D.p[cur];
  const tw=e.target.closest(".tw");if(tw){const t=p.T[+tw.dataset.i];selTown=t.n;renderPub();return townTip(p,t)}
  const cm=e.target.closest(".cm");if(cm){const k=p.cams[+cm.dataset.c];$("tip").innerHTML=`<b>${esc(tx("roadCam"))}</b><br>${esc(k[1])}<div class="cams"><a class="cam" href="${esc(camUrl(p,k))}" target="_blank" rel="noopener">${esc(tx("viewLive"))}</a></div>`}});
$("back").addEventListener("click",()=>{location.hash="";home()});
addEventListener("hashchange",route);
loadData().then(d=>{D=d;prep();updLabel();route();afterLoad()}).catch(()=>{$("upd").textContent=tx("loadFail")});
}
