name: Official 511 reports

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/official.py, .github/workflows/official.yml]

permissions:
  contents: write

concurrency:
  group: official
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Fetch provincial 511 reports
        run: python3 scripts/official.py
      - name: Publish if changed
        run: |
          if git diff --quiet -- official.json && git ls-files --error-unmatch official.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "official-511-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official.json
          git commit -m "Update official 511 reports"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && git push -q -f origin HEAD:gh-pages && break
            sleep 5
          done
