name: US data build (build branch only)
on:
  push:
    branches: [us-build]
    paths: [build/run.sh]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-build
  cancel-in-progress: false
jobs:
  run:
    if: github.ref == 'refs/heads/us-build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-build
          fetch-depth: 1
      - name: Run build step
        run: bash build/run.sh 2>&1 | tee /tmp/log.txt
      - name: Save results to the build branch
        if: always()
        run: |
          mkdir -p build/out && cp /tmp/log.txt build/out/log.txt
          git config user.name "us-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/out
          git commit -q -m "build output" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin us-build && git push -q origin HEAD:us-build && break; sleep 5; done
